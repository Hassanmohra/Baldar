<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلدار | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --light: #f8fafc;
            --gray: #94a3b8;
            --white: #ffffff;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
        }

        .login-screen {
            position: fixed;
            inset: 0;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .login-screen.hidden { opacity: 0; pointer-events: none; }
        .login-box {
            background: var(--dark-light);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 50px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-box .logo-icon { font-size: 3rem; margin-bottom: 10px; }
        .login-box h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-box p { color: var(--gray); margin-bottom: 30px; font-size: 0.9rem; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            color: var(--white);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 3px;
        }
        .login-box input:focus { outline: none; border-color: var(--primary); }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--gradient-1);
            border: none;
            border-radius: var(--radius);
            color: var(--white);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .sidebar {
            width: 280px;
            background: var(--dark-light);
            border-left: 1px solid rgba(255,255,255,0.05);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0; top: 0; bottom: 0;
            z-index: 100;
        }
        .sidebar-header { text-align: center; padding-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px; }
        .sidebar-header h3 { font-size: 1.3rem; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { list-style: none; flex: 1; }
        .nav-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            color: var(--gray); text-decoration: none; border-radius: var(--radius);
            font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .nav-menu a:hover, .nav-menu a.active { background: rgba(99,102,241,0.1); color: var(--white); }
        .nav-menu a.active { border-right: 3px solid var(--primary); }

        .main-content { flex: 1; margin-right: 280px; padding: 30px; min-height: 100vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--dark-light); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-lg); padding: 25px; }
        .stat-card h3 { font-size: 1.8rem; margin-bottom: 5px; }

        .content-section { display: none; }
        .content-section.active { display: block; }

        .card { background: var(--dark-light); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-lg); padding: 25px; margin-bottom: 25px; }

        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 600; cursor: pointer; border: none; }
        .btn-primary { background: var(--gradient-1); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-outline { background: transparent; color: var(--gray); border: 1px solid rgba(255,255,255,0.1); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--white); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--white);
            font-family: 'Cairo', sans-serif;
        }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 14px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-table th { color: var(--gray); font-size: 0.85rem; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--dark-light); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg); padding: 30px; width: 90%; max-width: 600px; }

        .toast-container { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--dark-light); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 15px 20px; color: white; min-width: 250px; }
        .toast.success { border-right: 4px solid var(--success); }
        .toast.error { border-right: 4px solid var(--danger); }
        .toast.info { border-right: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="logo-icon">⚡</div>
        <h2>بلدار</h2>
        <p>لوحة تحكم الموقع</p>
        <input type="password" id="passwordInput" placeholder="••••••">
        <button onclick="login()">دخول</button>
    </div>
</div>

<aside class="sidebar">
    <div class="sidebar-header">
        <h3>بلدار</h3>
        <span>لوحة التحكم</span>
    </div>
    <ul class="nav-menu">
        <li><a class="active" onclick="showSection('dashboard')"><i class="fas fa-chart-line"></i> الرئيسية</a></li>
        <li><a onclick="showSection('projects')"><i class="fas fa-briefcase"></i> الأعمال</a></li>
        <li><a onclick="showSection('settings')"><i class="fas fa-sliders-h"></i> الإعدادات</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="content-section active" id="dashboard">
        <div class="page-header">
            <div><h1>لوحة التحكم</h1><p>نظرة عامة على البيانات</p></div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h3 id="statCategories">0</h3><span>التصنيفات</span></div>
            <div class="stat-card"><h3 id="statProjects">0</h3><span>إجمالي الأعمال</span></div>
        </div>
    </div>

    <div class="content-section" id="projects">
        <div class="page-header">
            <div><h1>إدارة الأعمال</h1><p>إدارة المشاريع داخل التصنيفات</p></div>
            <button class="btn btn-primary" onclick="openProjectModal()"><i class="fas fa-plus"></i> إضافة عمل جديد</button>
        </div>
        <div class="card">
            <div id="projectsList">جاري التحميل...</div>
        </div>
    </div>

    <div class="content-section" id="settings">
        <div class="page-header"><h1>إعدادات GitHub</h1></div>
        <div class="card">
            <div class="form-group"><label>GitHub Token</label><input type="password" id="githubToken"></div>
            <div class="form-group"><label>Username</label><input type="text" id="githubUsername"></div>
            <div class="form-group"><label>Repository</label><input type="text" id="githubRepo"></div>
            <button class="btn btn-primary" onclick="saveGitHubSettings()">حفظ الإعدادات</button>
        </div>
    </div>
</main>

<div class="modal-overlay" id="projectModal">
    <div class="modal-box">
        <h3>إضافة مشروع جديد</h3>
        <div class="form-group">
            <label>التصنيف</label>
            <select id="projectCategorySelect"></select>
        </div>
        <div class="form-group"><label>اسم المشروع</label><input type="text" id="projectName"></div>
        <div class="form-group"><label>الوصف المختصر</label><input type="text" id="projectDesc"></div>
        <div class="form-group"><label>التفاصيل</label><textarea id="projectDetails"></textarea></div>
        <div class="form-group"><label>رابط الصورة</label><input type="text" id="projectImage"></div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-outline" onclick="closeModal('projectModal')">إلغاء</button>
            <button class="btn btn-primary" onclick="saveProject()">حفظ</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const CONFIG = {
    get token() { return localStorage.getItem('baldar_github_token') || ''; },
    get username() { return localStorage.getItem('baldar_github_username') || 'Hassanmohra'; },
    get repo() { return localStorage.getItem('baldar_github_repo') || 'project'; },
    get branch() { return 'main'; },
    get filePath() { return 'projects.json'; }
};

let rawData = { categories: [] };

function login() {
    const pass = document.getElementById('passwordInput').value;
    if (pass === (localStorage.getItem('baldar_admin_pass') || '123456')) {
        localStorage.setItem('baldar_admin_logged', 'true');
        document.getElementById('loginScreen').classList.add('hidden');
        initDashboard();
    }
}

if (localStorage.getItem('baldar_admin_logged') === 'true') {
    document.getElementById('loginScreen').classList.add('hidden');
    initDashboard();
}

function showSection(id) {
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'projects') loadProjectsFromGitHub();
}

async function githubApi(endpoint, options = {}) {
    const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}${endpoint}`;
    const headers = { 'Authorization': `token ${CONFIG.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
    const res = await fetch(url, { ...options, headers });
    return res.json();
}

async function loadProjectsFromGitHub() {
    try {
        const data = await githubApi(`/contents/${CONFIG.filePath}?ref=${CONFIG.branch}`);
        const bytes = Uint8Array.from(atob(data.content.replace(/\s/g, '')), c => c.charCodeAt(0));
        rawData = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        renderProjects();
    } catch(e) {
        showToast('فشل تحميل البيانات من GitHub', 'error');
    }
}

function renderProjects() {
    let totalProjects = 0;
    let html = '';
    const select = document.getElementById('projectCategorySelect');
    select.innerHTML = '';

    rawData.categories.forEach(cat => {
        select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
        totalProjects += cat.projects ? cat.projects.length : 0;

        html += `<h3 style="margin:20px 0 10px 0; color:var(--primary);">${cat.name}</h3>`;
        html += '<table class="data-table"><thead><tr><th>#</th><th>الصورة</th><th>اسم العمل</th><th>الإجراءات</th></tr></thead><tbody>';

        if(cat.projects && cat.projects.length > 0) {
            cat.projects.forEach(p => {
                html += `<tr>
                    <td>${p.id}</td>
                    <td><img src="${p.image || 'https://via.placeholder.com/40'}" width="40" height="40" style="border-radius:5px;"></td>
                    <td><strong>${p.name}</strong></td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteProject('${cat.id}', ${p.id})">حذف</button></td>
                </tr>`;
            });
        } else {
            html += `<tr><td colspan="4" style="text-align:center; color:var(--gray);">لا توجد أعمال في هذا التصنيف</td></tr>`;
        }
        html += '</tbody></table>';
    });

    document.getElementById('projectsList').innerHTML = html;
    document.getElementById('statCategories').innerText = rawData.categories.length;
    document.getElementById('statProjects').innerText = totalProjects;
}

async function saveProject() {
    const catId = document.getElementById('projectCategorySelect').value;
    const name = document.getElementById('projectName').value.trim();
    const desc = document.getElementById('projectDesc').value.trim();
    const details = document.getElementById('projectDetails').value.trim();
    const image = document.getElementById('projectImage').value.trim();

    if(!name) { showToast('اسم العمل مطلوب', 'error'); return; }

    const category = rawData.categories.find(c => c.id === catId);
    if(category) {
        if(!category.projects) category.projects = [];
        category.projects.push({
            id: Date.now(),
            name, desc, details, image,
            whatsapp: `مرحباً بلدار، أرغب في طلب خدمة متعلقة بـ (${name})`
        });

        await saveToGitHub();
        closeModal('projectModal');
        loadProjectsFromGitHub();
    }
}

async function deleteProject(catId, projectId) {
    if(!confirm('هل أنت تأكد من الحذف؟')) return;
    const category = rawData.categories.find(c => c.id === catId);
    if(category) {
        category.projects = category.projects.filter(p => p.id !== projectId);
        await saveToGitHub();
        loadProjectsFromGitHub();
    }
}

async function saveToGitHub() {
    try {
        showToast('جاري الحفظ على GitHub...', 'info');
        const data = await githubApi(`/contents/${CONFIG.filePath}?ref=${CONFIG.branch}`);
        const bytes = new TextEncoder().encode(JSON.stringify(rawData, null, 2));
        
        await githubApi(`/contents/${CONFIG.filePath}`, {
            method: 'PUT',
            body: JSON.stringify({
                message: 'Update projects via Admin',
                content: btoa(String.fromCharCode(...bytes)),
                sha: data.sha,
                branch: CONFIG.branch
            })
        });
        showToast('تم الحفظ بنجاح!', 'success');
    } catch(e) {
        showToast('خطأ أثناء الحفظ: ' + e.message, 'error');
    }
}

function openProjectModal() { document.getElementById('projectModal').classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function saveGitHubSettings() {
    localStorage.setItem('baldar_github_token', document.getElementById('githubToken').value.trim());
    localStorage.setItem('baldar_github_username', document.getElementById('githubUsername').value.trim());
    localStorage.setItem('baldar_github_repo', document.getElementById('githubRepo').value.trim());
    showToast('تم حفظ الإعدادات', 'success');
}

function showToast(m, t='info') {
    const el = document.createElement('div');
    el.className = `toast ${t}`;
    el.innerText = m;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function initDashboard() {
    document.getElementById('githubToken').value = CONFIG.token;
    document.getElementById('githubUsername').value = CONFIG.username;
    document.getElementById('githubRepo').value = CONFIG.repo;
}
</script>
</body>
</html>
